
name: Build Intention APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract source ZIP
        run: unzip -q intention_v0_4_phone_apk.zip

      - name: Generate Android project
        working-directory: intention
        run: |
          npx --yes @react-native-community/cli@latest init Intention --version 0.81.0 --skip-install

      - name: Prepare Intention
        working-directory: intention
        run: |
          cp App.tsx Intention/App.tsx
          cp -R src Intention/src
          python3 scripts/prepare_android.py
          cd Intention
          npm install @react-native-async-storage/async-storage@^2.2.0 @react-navigation/bottom-tabs@^7.4.0 @react-navigation/native@^7.1.0 react-native-safe-area-context@^5.6.0 react-native-screens@^4.16.0

      - name: Build APK
        working-directory: intention/Intention/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Intention-APK
          path: intention/Intention/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
